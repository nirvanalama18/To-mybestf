<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Sheruu Di 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Quicksand', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #ffdde1, #ee9ca7);
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  color: #5a3e4d;
}

.card {
  background: rgba(255, 255, 255, 0.6);
  backdrop-filter: blur(15px);
  padding: 40px;
  border-radius: 25px;
  width: 90%;
  max-width: 600px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.15);
  animation: fadeIn 2s ease forwards;
}

h1 {
  font-size: 2rem;
  margin-bottom: 20px;
}

p {
  font-size: 1.2rem;
  line-height: 1.7;
  margin-bottom: 15px;
  opacity: 0;
  transform: translateY(20px);
  transition: all 1.2s ease;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

.bro {
  font-size: 1.6rem;
  font-weight: 700;
  margin-top: 20px;
  color: #d63384;
}

/* Floating hearts */
.heart {
  position: absolute;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 7s linear infinite;
  opacity: 0.7;
}

@keyframes floatUp {
  0% {
    transform: translateY(0);
    opacity: 0.7;
  }
  100% {
    transform: translateY(-110vh);
    opacity: 0;
  }
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

</style>
</head>

<body>

<div class="card">
  <h1>For Sheruu Di 💜</h1>

  <p id="line1">I'm missing u so so much sheruu di.</p>

  <p id="line2">
    I hope u r doing great. Stay safe, stay healthy and happy.
  </p>

  <p id="line3">
    Just wanted to remind you that your brother misses you.
  </p>

  <p id="line4" class="bro">
    YOUR BROOOOO !!!! 💗
  </p>
</div>

<script>

// Smooth text reveal timing
setTimeout(() => {
  document.getElementById("line1").classList.add("show");
}, 1000);

setTimeout(() => {
  document.getElementById("line2").classList.add("show");
}, 3000);

setTimeout(() => {
  document.getElementById("line3").classList.add("show");
}, 5000);

setTimeout(() => {
  document.getElementById("line4").classList.add("show");
}, 7000);

// Floating hearts generator
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💜";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 15 + 15) + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 7000);
}

setInterval(createHeart, 600);

</script>

</body>
</html>
