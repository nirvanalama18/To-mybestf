<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Transmission to Didi 💫</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #0a0a1a, #000000);
  font-family: 'Orbitron', sans-serif;
  color: white;
}

canvas { display: block; }

.overlay {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 45%;
  font-size: 2rem;
  letter-spacing: 3px;
  opacity: 0;
  transition: 2s ease;
}

.small {
  font-size: 1.4rem;
}
</style>
</head>
<body>

<div class="overlay" id="text1">Incoming transmission...</div>
<div class="overlay" id="text2">To: Didi 💜</div>
<div class="overlay small" id="text3">
I miss you. I love you. That’s it.<br>No big speech.
</div>

<audio id="music" src="piano.mp3"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

camera.position.z = 6;

// ⭐ Starfield
const starsGeometry = new THREE.BufferGeometry();
const starCount = 4000;
const positions = [];

for (let i = 0; i < starCount; i++) {
  positions.push(
    (Math.random() - 0.5) * 200,
    (Math.random() - 0.5) * 200,
    (Math.random() - 0.5) * 200
  );
}

starsGeometry.setAttribute('position',
  new THREE.Float32BufferAttribute(positions, 3)
);

const starsMaterial = new THREE.PointsMaterial({
  color: 0xaa88ff,
  size: 0.5
});

const starField = new THREE.Points(starsGeometry, starsMaterial);
scene.add(starField);

// 💜 Futuristic Heart
const geometry = new THREE.TorusKnotGeometry(1.2, 0.4, 150, 20);
const material = new THREE.MeshBasicMaterial({
  color: 0xff66ff,
  wireframe: true
});
const heart = new THREE.Mesh(geometry, material);
scene.add(heart);

function animate() {
  requestAnimationFrame(animate);
  heart.rotation.x += 0.005;
  heart.rotation.y += 0.01;
  starField.rotation.y += 0.0003;
  renderer.render(scene, camera);
}
animate();

// 🎬 Timeline
const music = document.getElementById("music");

setTimeout(() => {
  music.play();
  document.getElementById("text1").style.opacity = 1;
}, 2000);

setTimeout(() => {
  document.getElementById("text1").style.opacity = 0;
  document.getElementById("text2").style.opacity = 1;
}, 10000);

setTimeout(() => {
  document.getElementById("text2").style.opacity = 0;
  document.getElementById("text3").style.opacity = 1;
}, 25000);

// Responsive
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
