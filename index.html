<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elder Sister | Tribute</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', sans-serif;
}

body {
    background: #0f172a;
    color: #f1f5f9;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}

/* Animated Background Glow */
body::before {
    content: "";
    position: absolute;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, #3b82f6, transparent 70%);
    animation: move 8s infinite alternate ease-in-out;
    z-index: 0;
}

@keyframes move {
    from { transform: translate(-200px, -200px); }
    to { transform: translate(200px, 200px); }
}

.card {
    position: relative;
    background: rgba(30, 41, 59, 0.8);
    padding: 50px;
    border-radius: 20px;
    backdrop-filter: blur(20px);
    text-align: center;
    width: 420px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    z-index: 1;
    animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
}

h1 {
    font-size: 28px;
    margin-bottom: 20px;
    color: #38bdf8;
}

p {
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 30px;
    color: #cbd5e1;
}

.highlight {
    color: #3b82f6;
    font-weight: bold;
}

button {
    padding: 12px 28px;
    border: none;
    border-radius: 50px;
    background: #3b82f6;
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s ease;
}

button:hover {
    background: #2563eb;
    transform: scale(1.05);
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #94a3b8;
}
</style>
</head>

<body>

<div class="card">
    <h1>To My Elder Sister</h1>
    <p>
        I miss you more than words can describe.<br><br>
        You are my <span class="highlight">strength</span>,
        my <span class="highlight">mentor</span>,
        and my <span class="highlight">forever safe place</span>.<br><br>
        Distance = Temporary<br>
        Bond = Infinite ♾️
    </p>

    <button onclick="showMessage()">Reveal Message</button>

    <div class="footer">Built with Respect & Love 💙</div>
</div>

<script>
function showMessage() {
    alert("No matter how far life takes us, you will always be my hero. I Miss You 💙");
}
</script>

</body>
</html>
