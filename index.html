<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Sheruu Di 💜</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  height: 100vh;
  overflow: hidden;
  background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
  display: flex;
  justify-content: center;
  align-items: center;
  color: white;
}

.container {
  text-align: center;
  position: relative;
  width: 90%;
  max-width: 700px;
}

.message {
  font-size: 2rem;
  opacity: 0;
  transform: translateY(30px);
  transition: all 1.5s ease;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

.small {
  font-size: 1.4rem;
  margin-top: 20px;
  line-height: 1.6;
}

.big {
  font-size: 2.5rem;
  font-weight: 700;
  margin-top: 30px;
  color: #ffb3ff;
  text-shadow: 0 0 15px #ff66ff;
}

/* Floating hearts */
.heart {
  position: absolute;
  bottom: -20px;
  font-size: 20px;
  animation: floatUp 8s linear infinite;
  opacity: 0.6;
}

@keyframes floatUp {
  0% {
    transform: translateY(0) scale(1);
    opacity: 0.6;
  }
  100% {
    transform: translateY(-110vh) scale(1.5);
    opacity: 0;
  }
}

/* Glow circle background */
.glow {
  position: absolute;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(255,102,255,0.4), transparent 70%);
  border-radius: 50%;
  filter: blur(80px);
  z-index: -1;
  animation: pulse 6s ease-in-out infinite;
}

@keyframes pulse {
  0%,100% { transform: scale(1); }
  50% { transform: scale(1.2); }
}

</style>
</head>

<body>

<div class="glow"></div>

<div class="container">
  <div id="msg1" class="message">
    I'm missing u so so much sheruu di 💜
  </div>

  <div id="msg2" class="message small">
    I hope u r doing great,<br>
    stay safe, stay healthy and happy.
  </div>

  <div id="msg3" class="message big">
    YOUR BROOOOO !!!! 🚀
  </div>
</div>

<script>

// Smooth timeline transitions
setTimeout(() => {
  document.getElementById("msg1").classList.add("show");
}, 2000);

setTimeout(() => {
  document.getElementById("msg2").classList.add("show");
}, 7000);

setTimeout(() => {
  document.getElementById("msg3").classList.add("show");
}, 12000);

// Floating hearts generator
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "💜";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (Math.random() * 20 + 15) + "px";
  heart.style.animationDuration = (Math.random() * 5 + 5) + "s";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 8000);
}

setInterval(createHeart, 500);

</script>

</body>
</html>
