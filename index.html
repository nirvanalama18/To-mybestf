<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Signal to Didi 💫</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
  font-family: 'Segoe UI', sans-serif;
  color: white;
}

canvas { display: block; }

.overlay {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 45%;
  font-size: 2rem;
  letter-spacing: 2px;
  opacity: 0;
  transition: opacity 2s ease;
}

.small {
  font-size: 1.4rem;
}
</style>
</head>
<body>

<div class="overlay" id="text1">Incoming transmission...</div>
<div class="overlay" id="text2">To: Didi 💜</div>
<div class="overlay small" id="text3">
I miss you. I love you.<br>No dramatic speech.
</div>

<audio id="music" src="piano.mp3"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth/window.innerHeight,
  0.1,
  1000
);

camera.position.set(0,0,8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
document.body.appendChild(renderer.domElement);

// Lighting
const light = new THREE.PointLight(0xff66ff, 2);
light.position.set(5,5,5);
scene.add(light);

const ambient = new THREE.AmbientLight(0x222244);
scene.add(ambient);

// Starfield
const starsGeometry = new THREE.BufferGeometry();
const starCount = 6000;
const positions = [];

for (let i = 0; i < starCount; i++) {
  positions.push(
    (Math.random() - 0.5) * 400,
    (Math.random() - 0.5) * 400,
    (Math.random() - 0.5) * 400
  );
}

starsGeometry.setAttribute(
  'position',
  new THREE.Float32BufferAttribute(positions, 3)
);

const starsMaterial = new THREE.PointsMaterial({
  color: 0xaa88ff,
  size: 0.7
});

const starField = new THREE.Points(starsGeometry, starsMaterial);
scene.add(starField);

// Main object (futuristic core)
const geometry = new THREE.TorusKnotGeometry(1.5, 0.5, 200, 32);
const material = new THREE.MeshStandardMaterial({
  color: 0xff66ff,
  emissive: 0x330033,
  metalness: 0.8,
  roughness: 0.2
});

const core = new THREE.Mesh(geometry, material);
scene.add(core);

// Animation
function animate() {
  requestAnimationFrame(animate);

  core.rotation.x += 0.003;
  core.rotation.y += 0.005;

  starField.rotation.y += 0.0005;

  // Cinematic slow camera motion
  camera.position.z = 8 + Math.sin(Date.now() * 0.0005) * 0.5;

  renderer.render(scene, camera);
}
animate();

// Timeline
const music = document.getElementById("music");

setTimeout(() => {
  music.play().catch(()=>{});
  document.getElementById("text1").style.opacity = 1;
}, 2000);

setTimeout(() => {
  document.getElementById("text1").style.opacity = 0;
  document.getElementById("text2").style.opacity = 1;
}, 9000);

setTimeout(() => {
  document.getElementById("text2").style.opacity = 0;
  document.getElementById("text3").style.opacity = 1;
}, 22000);

// Responsive
window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
});
</script>

</body>
</html>
